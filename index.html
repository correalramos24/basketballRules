<!doctype html>
<html lang="ca">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reglament de Basquetbol FCBQ 2024</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-badge">FCBQ</span>
        <div class="brand-text">
          <span class="brand-title">Reglament Oficial de Basquetbol</span>
          <span class="brand-sub" id="doc-subtitle">Regles FIBA 2024 adaptades per l'FCBQ</span>
        </div>
      </div>
      <nav class="doc-tabs" role="tablist" aria-label="Documents">
        <button class="doc-tab active" role="tab" aria-selected="true" data-doc="regles">Regles</button>
        <button class="doc-tab" role="tab" aria-selected="false" data-doc="interps">Interpretacions</button>
      </nav>
    </header>

    <div class="layout">
      <aside class="sidebar" id="sidebar" aria-label="Índex">
        <div class="sidebar-toggle-wrap">
          <button class="sidebar-toggle" id="sidebar-toggle" aria-controls="sidebar-nav">Índex</button>
        </div>
        <div class="sidebar-inner">
          <div class="sidebar-search">
            <input type="search" id="search" placeholder="Cercar al document…" autocomplete="off">
            <div id="search-results" class="search-results" hidden></div>
          </div>
          <nav id="sidebar-nav" class="sidebar-nav" aria-label="Navegació"></nav>
        </div>
      </aside>

      <main class="content" id="content-scroll">
        <div id="reglament" class="markdown-body" tabindex="-1"></div>
      </main>
    </div>

    <footer class="foot">
      <p>Contingut dels documents oficials de les Regles de Joc i de les Interpretacions, adaptats i distribuïts per la Federació Catalana de Basquetbol (FCBQ).</p>
      <p>Projecte original de Victor Correal Ramos © 2026</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
