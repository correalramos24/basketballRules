# Static site served by nginx on port 8080 (matches the existing deployment).
server {
    listen       8080;
    listen  [::]:8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Emit relative redirects (e.g. /articles/art-01/) instead of absolute
    # ones that leak the internal port (:8080) and http scheme, which are
    # not reachable through the public reverse proxy.
    absolute_redirect off;

    # Astro emits directory-style URLs: /articles/art-05/index.html
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Long-lived cache for fingerprinted build assets
    # (^~ so it wins over the regex location below)
    location ^~ /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(?:css|js|mjs|woff2?|ttf|eot|png|jpe?g|gif|svg|ico|webp|avif)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        image/svg+xml;
}
